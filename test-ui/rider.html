<!DOCTYPE html>
<html>
<head>
<title>Rider</title>
</head>
<body>

<h1>🚖 Rider App</h1>

<button onclick="requestRide()">
Request Ride
</button>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
const socket = io("http://192.168.100.28:5000");

function requestRide() {

  socket.emit("ride_request", {
    pickup: "Home",
    destination: "Mall"
  });

  alert("Ride Requested");
}
</script>

</body>
</html>
