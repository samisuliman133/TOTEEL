<!DOCTYPE html>
<html>
<head>
    <title>Toteel Test</title>
</head>
<body>

<h1>🚖 Toteel Live Test</h1>

<button onclick="sendRide()">Request Ride</button>

<h2 id="status">Waiting...</h2>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
const socket = io("http://192.168.100.28:5000");

socket.on("connect", () => {
    document.getElementById("status").innerText =
        "✅ Connected to Toteel";
});

socket.on("ride_received", () => {
    alert("🚖 Driver received ride!");
});

function sendRide() {
    socket.emit("ride_request", {
        pickup: "Location A",
        destination: "Location B"
    });

    alert("Ride Requested");
}
</script>

</body>
</html>
